# Name is Step x, where x is the last step number in the exercise.
name: Step 1

# Set these variables to have the correct exercise name and module title.
env:
  EXERCISE_NAME: "ai-training-mcp"
  MODULE_TITLE: "MCP Tools"

# Define how the workflow is triggered.
on:
  push:
    paths:
      - 'docs/MigrationPlan.md'
      - 'docs/MigrationPlanWithContext7.md'
      - 'e2e/**'
      - 'test/**'
      - 'src/**'

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  check_initial_commit:
    name: Check if initial commit
    runs-on: ubuntu-latest
    outputs:
      is-initial: ${{ steps.check.outputs.is-initial }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check commit count
        id: check
        run: |
          commit_count=$(git rev-list --count HEAD)
          echo "is-initial=$([[ $commit_count -eq 1 ]] && echo true || echo false)" >> $GITHUB_OUTPUT

  find_exercise:
    name: Find Exercise Issue
    needs: check_initial_commit
    if: needs.check_initial_commit.outputs.is-initial == 'false'
    uses: ./.github/workflows/find-exercise-issue.yml

  post_checking_message:
    name: Post checking work message
    needs: [find_exercise]
    runs-on: ubuntu-latest
    outputs:
      comment-id: ${{ steps.post.outputs.comment-id }}
    env:
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Post checking work message
        id: post
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.github/markdown-templates/exercise/checking-work.md', 'utf8');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body
            });
            core.setOutput('comment-id', comment.id);

  validate_exercise:
    name: Validate Exercise Completion
    runs-on: ubuntu-latest
    needs: post_checking_message
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check migration plan files exist
        run: |
          if [ ! -f "docs/MigrationPlan.md" ]; then
            echo "❌ docs/MigrationPlan.md not found"
            exit 1
          fi
          echo "✅ docs/MigrationPlan.md exists"

          if [ ! -f "docs/MigrationPlanWithContext7.md" ]; then
            echo "❌ docs/MigrationPlanWithContext7.md not found"
            exit 1
          fi
          echo "✅ docs/MigrationPlanWithContext7.md exists"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install playwright dependencies
        run: npx playwright install

      - name: Build project
        run: npm run build

      - name: Run e2e tests
        run: npm run test:e2e

  post_final_content:
    name: Post final content
    needs: [find_exercise, validate_exercise]
    if: needs.validate_exercise.result == 'success'
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Disable current workflow
        run: |
          gh workflow disable "${{github.workflow}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finish Exercise
    needs: [find_exercise, post_checking_message, validate_exercise]
    if: needs.validate_exercise.result == 'success'
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
      ISSUE_URL: ${{ needs.find_exercise.outputs.issue-url }}
      CHECKING_COMMENT_ID: ${{ needs.post_checking_message.outputs.comment-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update issue and build final README
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            function render(path, vars) {
              let text = fs.readFileSync(path, 'utf8');
              for (const [key, value] of Object.entries(vars)) {
                text = text.replaceAll(`{{ ${key} }}`, value);
              }
              return text;
            }
            const finalComment = render('.github/markdown-templates/exercise/exercise-finished.md', {
              title: process.env.MODULE_TITLE,
              login: context.actor,
              repo_full_name: `${context.repo.owner}/${context.repo.repo}`
            });
            const finalReadme = render('.github/markdown-templates/readme/exercise-finished.md', {
              login: context.actor,
              issue_url: process.env.ISSUE_URL
            });
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.CHECKING_COMMENT_ID),
              body: finalComment
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              state: 'closed'
            });
            fs.writeFileSync('README.md', finalReadme);

      - name: Commit and push README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Congratulations!🎉"
            git push
          fi

  post_mistake_message:
    name: Post mistake message
    needs: [post_checking_message, validate_exercise]
    if: always() && needs.validate_exercise.result == 'failure'
    runs-on: ubuntu-latest
    env:
      CHECKING_COMMENT_ID: ${{ needs.post_checking_message.outputs.comment-id }}

    # Set the feedback message to a proper one in the 'Post mistake message' step.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Post mistake message
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const feedback = "The exercise validation failed. Please ensure that all tests pass and that both migration plan files exist (`docs/MigrationPlan.md` and `docs/MigrationPlanWithContext7.md`). Then try again.";
            let body = fs.readFileSync('.github/markdown-templates/exercise/step-mistake.md', 'utf8');
            body = body.replaceAll('{{ feedback_message }}', feedback);
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.CHECKING_COMMENT_ID),
              body
            });
